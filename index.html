&lt;section id=&quot;ol-overview&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ol-overview-tab&quot;&gt;&lt;div class=&quot;ol-kpis&quot; id=&quot;ol-kpis&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ol-grid&quot;&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;What changed contribution?&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Exact bridge from plan to actual · USD&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;ol-bridge&quot; class=&quot;ol-bridge&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;Volume at planned margin; rate effect at actual volume. Cost impacts include payment fees.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Market performance&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Select a market to investigate its stores&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Market performance&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Demo market&lt;/th&gt;&lt;th&gt;Sites&lt;/th&gt;&lt;th&gt;Contribution&lt;/th&gt;&lt;th&gt;vs. plan&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-markets&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ol-metrics&quot; id=&quot;ol-distribution&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot;&gt;Store distribution prevents a chain average from hiding the underperforming tail.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Stores needing a closer look&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Five lowest contribution variances in the selected scope&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;ol-tag&quot; id=&quot;ol-priority-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Store contribution priorities&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Demo store / district&lt;/th&gt;&lt;th&gt;Cohort&lt;/th&gt;&lt;th&gt;Contribution&lt;/th&gt;&lt;th&gt;vs. plan&lt;/th&gt;&lt;th&gt;Largest adverse driver&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-stores&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot; id=&quot;ol-store-detail&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/section&gt;
&lt;section id=&quot;ol-commercial&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ol-commercial-tab&quot; hidden&gt;&lt;div class=&quot;ol-kpis&quot; id=&quot;ol-commercial-kpis&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ol-grid&quot;&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;h2&gt;Traffic × basket = inside sales&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot; id=&quot;ol-comp-scope&quot;&gt;&lt;/p&gt;&lt;div class=&quot;ol-flow&quot; id=&quot;ol-traffic&quot;&gt;&lt;/div&gt;&lt;div id=&quot;ol-commercial-detail&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;Same sites and equivalent 28-day periods. New and converted cohorts are excluded from this demo&#x27;s comparable-store set.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;h2&gt;Category economics&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Gross profit after discounts, waste and shrink&lt;/p&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Inside category economics&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Category&lt;/th&gt;&lt;th&gt;Sales&lt;/th&gt;&lt;th&gt;GP&lt;/th&gt;&lt;th&gt;Margin&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-categories&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot; id=&quot;ol-food&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;h2&gt;Customer connection: measure coverage first&lt;/h2&gt;&lt;div class=&quot;ol-metrics&quot; id=&quot;ol-loyalty&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot;&gt;Illustrative loyalty matching only. Identified customers are a selected sample; pump-to-store linkage is not a causal promotion result.&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;
&lt;section id=&quot;ol-customers&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ol-customers-tab&quot; hidden&gt;
&lt;div class=&quot;ol-kpis&quot; id=&quot;ol-customer-kpis&quot;&gt;&lt;/div&gt;
&lt;div class=&quot;ol-grid&quot;&gt;
&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;When customers shop&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Inside transaction share by daypart · Select a period&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;ol-tag&quot;&gt;All inside transactions&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;ol-dayparts&quot; class=&quot;ol-dayparts&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot; id=&quot;ol-daypart-detail&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;ol-panel&quot;&gt;&lt;h2&gt;Customer journey&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;From fuel visit to inside purchase · Linked transactions only&lt;/p&gt;&lt;div id=&quot;ol-journey&quot; class=&quot;ol-barrows&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot; id=&quot;ol-repeat&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;An inside visit within 30 minutes is an observed link, not proof that fuel caused the purchase.&lt;/p&gt;&lt;/section&gt;
&lt;/div&gt;
&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Where to explore customer opportunity&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Observed behaviors by demo market · Context, not a causal ranking&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Customer behavior by market&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Demo market&lt;/th&gt;&lt;th&gt;Repeat visits&lt;/th&gt;&lt;th&gt;Visits / customer&lt;/th&gt;&lt;th&gt;Food attachment&lt;/th&gt;&lt;th&gt;Fuel → inside&lt;/th&gt;&lt;th&gt;Inside identity coverage&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-customer-markets&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;Repeat rate and frequency count identified customer–store pairs; customers visiting multiple stores can appear more than once. These are not chain-wide unique customer metrics. New sites have shorter observation windows.&lt;/p&gt;&lt;/section&gt;
&lt;/section&gt;

&lt;section id=&quot;ol-operations&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ol-operations-tab&quot; hidden&gt;&lt;div class=&quot;ol-kpis&quot; id=&quot;ol-ops-kpis&quot;&gt;&lt;/div&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Weekly action queue&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;One illustrative priority per store · Review evidence before assigning a fix&lt;/p&gt;&lt;/div&gt;&lt;span class=&quot;ol-tag gold&quot; id=&quot;ol-queue-count&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Operating action queue&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Store / issue&lt;/th&gt;&lt;th&gt;Severity&lt;/th&gt;&lt;th&gt;Owner&lt;/th&gt;&lt;th&gt;Due&lt;/th&gt;&lt;th&gt;Review&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-actions&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot; id=&quot;ol-action-detail&quot;&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ol-panel&quot; style=&quot;margin-top:18px&quot;&gt;&lt;h2&gt;Data confidence &amp; close controls&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Demonstration coverage · Simulated close completed September 29, 06:00 CT&lt;/p&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Data quality and coverage&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Proposed data source&lt;/th&gt;&lt;th&gt;Coverage in scope&lt;/th&gt;&lt;th&gt;Decision rule&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-quality&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;Source types are recommendations, not claims about OXXO&#x27;s technology. Unmatched operational feeds are excluded from those rates; finance totals retain all sites.&lt;/p&gt;&lt;/section&gt;&lt;/section&gt;
&lt;section id=&quot;ol-growth&quot; role=&quot;tabpanel&quot; aria-labelledby=&quot;ol-growth-tab&quot; hidden&gt;&lt;div class=&quot;ol-statusbar&quot;&gt;&lt;span&gt;Market filter applies · Cohort filter does not apply to this cross-cohort review&lt;/span&gt;&lt;span&gt;All projects, targets and returns are hypothetical&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ol-kpis&quot; id=&quot;ol-growth-kpis&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ol-grid&quot;&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Early operating ramp&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Contribution / open day · Cohort actual ÷ original plan&lt;/p&gt;&lt;/div&gt;&lt;label class=&quot;ol-note&quot;&gt;Cohort&lt;select id=&quot;ol-ramp-select&quot; aria-label=&quot;Ramp cohort&quot;&gt;&lt;option value=&quot;converted&quot;&gt;Converted stores&lt;/option&gt;&lt;option value=&quot;new&quot;&gt;New stores&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;&lt;/div&gt;&lt;div class=&quot;ol-legend&quot;&gt;&lt;span&gt;&lt;i&gt;&lt;/i&gt;Illustrative actual&lt;/span&gt;&lt;span&gt;&lt;i class=&quot;plan&quot;&gt;&lt;/i&gt;Original plan = 100%&lt;/span&gt;&lt;/div&gt;&lt;svg id=&quot;ol-ramp&quot; class=&quot;ol-chart&quot; role=&quot;img&quot; aria-label=&quot;Cohort contribution ramp compared with original plan&quot;&gt;&lt;/svg&gt;&lt;p class=&quot;ol-note&quot;&gt;Illustrative 30 / 60 / 90-day cohort history, distinct from the current four-week close. A before/after change is not causal evidence.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;h2&gt;Conversion investment sensitivity&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Per-store steady-state assumptions · Planning illustration&lt;/p&gt;&lt;div class=&quot;ol-scenario&quot;&gt;&lt;label&gt;Inside sales uplift: &lt;strong id=&quot;ol-uplift-value&quot;&gt;&lt;/strong&gt;&lt;input id=&quot;ol-uplift&quot; aria-label=&quot;Inside sales uplift percent&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;8&quot;&gt;&lt;/label&gt;&lt;label&gt;Conversion investment: &lt;strong id=&quot;ol-capex-value&quot;&gt;&lt;/strong&gt;&lt;input id=&quot;ol-capex&quot; aria-label=&quot;Conversion investment in thousands of dollars&quot; type=&quot;range&quot; min=&quot;60&quot; max=&quot;240&quot; step=&quot;10&quot; value=&quot;120&quot;&gt;&lt;/label&gt;&lt;/div&gt;&lt;div id=&quot;ol-investment&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&lt;p class=&quot;ol-note&quot; style=&quot;margin-top:12px&quot;&gt;Simple contribution payback, not ROIC or discounted cash flow. Excludes ramp delay, taxes, financing, working capital and maintenance capex.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;section class=&quot;ol-panel&quot;&gt;&lt;div class=&quot;ol-panelhead&quot;&gt;&lt;div&gt;&lt;h2&gt;Capital &amp; readiness pipeline&lt;/h2&gt;&lt;p class=&quot;ol-sub&quot;&gt;Approvals, forecast cost and blockers remain visible before expansion&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ol-tablewrap&quot;&gt;&lt;table aria-label=&quot;Illustrative expansion pipeline&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Demo project&lt;/th&gt;&lt;th&gt;Stage&lt;/th&gt;&lt;th&gt;Approved&lt;/th&gt;&lt;th&gt;Committed&lt;/th&gt;&lt;th&gt;Spent&lt;/th&gt;&lt;th&gt;Forecast final&lt;/th&gt;&lt;th&gt;Next gate / blocker&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;ol-pipeline&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;ol-detail&quot;&gt;&lt;h3&gt;Conversion evaluation design&lt;/h3&gt;&lt;p class=&quot;ol-sub&quot;&gt;Match converted sites to similar unconverted sites by market, format and prior trend; compare the change in contribution after adjusting for operating days and seasonality. Keep food, coffee, labor and waste effects visible.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/section&gt;
&lt;details&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;Metric definitions, assumptions &amp; research basis&lt;/summary&gt;&lt;p&gt;&lt;strong&gt;All operating numbers are fictional.&lt;/strong&gt; The 300-site demonstration is not OXXO&#x27;s actual footprint. Demo markets, districts, budgets, owners, thresholds, dates, projects and targets do not describe internal OXXO plans.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Site controllable contribution:&lt;/strong&gt; inside gross profit + retail fuel gross profit − fully loaded store labor − payment fees − other controllable store expenses. Excludes occupancy/rent, depreciation, corporate allocations, interest and income taxes; not net income, EBITDA or free cash flow. Waste and shrink are already in inside cost of goods sold and are not deducted twice.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Fuel:&lt;/strong&gt; retail fuel GP is net fuel sales less landed fuel cost, excluding fuel taxes; cents per gallon is total GP ÷ total gallons × 100, before payment fees. Inside sales exclude fuel, sales tax and lottery pass-throughs. Ratios are recomputed from totals, never averaged across stores.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Comparables:&lt;/strong&gt; only the 240 fictional established stores qualify, subject to market/cohort filters; identical stores and equivalent 28-day periods are compared. Converted/new cohorts show N/A for these growth rates. Like-for-like sales growth = (1 + transaction growth) × (1 + basket growth) − 1.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Operations:&lt;/strong&gt; dispenser uptime uses available ÷ scheduled dispenser-hours for sites with telemetry; availability uses available ÷ audited priority-item checks. Food waste is disposal cost ÷ food sales. Inside GP / labor hour uses all paid store hours and is not an individual productivity score. Local review flags do not contact anyone or resolve an issue.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Investment sensitivity:&lt;/strong&gt; $2.6m annual inside sales × sales uplift × 36% incremental gross margin − $28k added annual operating cost. Fuel GP held flat. Payback = investment ÷ positive annual incremental contribution; no finite payback when contribution is zero or negative. These are scenario inputs, not forecasts or OXXO assumptions.&lt;/p&gt;&lt;p&gt;&lt;strong&gt;Research basis:&lt;/strong&gt; FEMSA 2025 annual report (published March 2026): U.S. conversion and food/coffee adaptation; OXXO USA Growth &amp; Real Estate: South-Central U.S. sites, chains and development; NACS, August 31, 2026: transaction pressure, labor productivity and inventory; Casey&#x27;s, September 8, 2026: comp inside sales, gallons and fuel margin; Murphy USA, March 2026: investment cohorts and store ramp. Public research informs the design; no peer metric is treated as an OXXO target.&lt;/p&gt;&lt;/details&gt;
&lt;footer class=&quot;ol-footer&quot;&gt;&lt;span&gt;Concept by Bijaya Humagain · Manager, Business Intelligence &amp; Analytics interview&lt;/span&gt;&lt;span&gt;Research-informed design · Synthetic operating data&lt;/span&gt;&lt;/footer&gt;
&lt;/div&gt;
&lt;script&gt;
(()=&gt;{
const root=document.getElementById(&#x27;oxxo-leadership&#x27;),$=id=&gt;root.querySelector(&#x27;#&#x27;+id);
const markets=[{id:&#x27;TXW&#x27;,name:&#x27;West Texas&#x27;},{id:&#x27;TXC&#x27;,name:&#x27;Central Texas&#x27;},{id:&#x27;NM&#x27;,name:&#x27;New Mexico&#x27;},{id:&#x27;AR&#x27;,name:&#x27;Arkansas&#x27;}];
const cohortName={established:&#x27;Established&#x27;,converted:&#x27;Converted&#x27;,new:&#x27;New&#x27;};
const stores=Array.from({length:300},(_,i)=&gt;{
 const market=markets[Math.floor(i/75)],j=i%75,cohort=j%15&lt;12?&#x27;established&#x27;:j%15&lt;14?&#x27;converted&#x27;:&#x27;new&#x27;,days=cohort===&#x27;new&#x27;?21:28;
 const psales=(176000+(j%23)*2500)*(days/28)*(cohort===&#x27;new&#x27;?.82:1),sales=psales*(.965+(i%17)*.005+(market.id===&#x27;TXC&#x27;?.012:0));
 const pgal=(127000+(j%19)*3100)*days/28,gal=pgal*(.956+(i%13)*.005),pfm=.302+(j%5)*.003,fm=pfm-.009+(i%11)*.0015-(i%19===0?.034:0);
 const wasteRate=.017+(i%9)*.003,foodShare=.21+(i%7)*.005,food=sales*foodShare,beverage=sales*.22,tobacco=sales*.26,otherSales=sales-food-beverage-tobacco;
 const categories=[{name:&#x27;Food &amp; dispensed drinks&#x27;,sales:food,gp:food*(.54-wasteRate)},{name:&#x27;Packaged beverages&#x27;,sales:beverage,gp:beverage*(.438-(i%5)*.002)},{name:&#x27;Tobacco&#x27;,sales:tobacco,gp:tobacco*.172},{name:&#x27;Other merchandise&#x27;,sales:otherSales,gp:otherSales*.329}];
 const merch=categories.reduce((n,c)=&gt;n+c.gp,0),pmm=.356,pmerch=psales*pmm,fuel=gal*fm,pfuel=pgal*pfm;
 const plabor=(31000+(j%9)*480)*days/28,labor=plabor*(1.008+(i%7)*.005),pother=(10800+(j%11)*170)*days/28,other=pother*(.98+(i%7)*.008);
 const pfees=(psales+pgal*3.12)*.015,fees=(sales+gal*(2.95+(i%7)*.03))*.0154;
 const contrib=merch+fuel-labor-other-fees,plan=pmerch+pfuel-plabor-pother-pfees;
 const lySales=cohort===&#x27;established&#x27;?sales/(1+.008+(i%9)*.003):0,lyTx=lySales/(8.8+(i%5)*.1),tx=cohort===&#x27;established&#x27;?lyTx*(.977+(i%8)*.004):sales/9.4,lyGal=cohort===&#x27;established&#x27;?gal/(.981+(i%7)*.004):0;
 const hours=labor/21.5,scheduled=12*24*days,telemetry=i%29!==0,upRate=i%31===0?.945:.984+(i%12)*.001,audits=240+(i%5)*24,available=Math.round(audits*(.946+(i%9)*.005));
 const loyalFuel=Math.round(gal/11*.29),linked=Math.round(loyalFuel*(.18+(i%8)*.013)),totalFuelTx=Math.round(gal/11),identifiedInside=Math.round(tx*(.30+(i%6)*.014));
 return{id:market.id+&#x27;-&#x27;+String(j+1).padStart(3,&#x27;0&#x27;),market:market.id,district:market.id+&#x27; D&#x27;+(Math.floor(j/15)+1),cohort,days,sales,psales,gal,pgal,fm,pfm,merch,pmerch,fuel,pfuel,labor,plabor,other,pother,fees,pfees,contrib,plan,lySales,lyTx,tx,lyGal,categories,food,waste:food*wasteRate,hours,scheduled,telemetry,availableHours:scheduled*upRate,audits,available,loyalFuel,linked,totalFuelTx,identifiedInside,inventory:merch*.57,monthlyCOGS:sales-merch,variance:contrib-plan,index:i};
});
const num=new Intl.NumberFormat(&#x27;en-US&#x27;,{maximumFractionDigits:0});
const money=n=&gt;(n&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+&#x27;$&#x27;+num.format(Math.abs(n));
const cash=n=&gt;(n&lt;0?&#x27;−&#x27;:&#x27;&#x27;)+&#x27;$&#x27;+(Math.abs(n)&gt;=1e6?(Math.abs(n)/1e6).toFixed(2)+&#x27;m&#x27;:(Math.abs(n)/1000).toFixed(1)+&#x27;k&#x27;);
const signed=n=&gt;(n&gt;=0?&#x27;+&#x27;:&#x27;−&#x27;)+cash(Math.abs(n));

    }

      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
